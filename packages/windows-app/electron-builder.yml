appId: com.localhostkiller.app
productName: Localhost Killer
copyright: Copyright (c) 2026 localhostkiller contributors
electronVersion: 31.7.7

# Main + preload are bundled by esbuild; renderer is bundled by Vite.
# So there is nothing to install at packaging time — neutralise the
# production dependency list so electron-builder does not run
# `npm install --production` (which prunes hoisted workspace deps and
# breaks 7zip-bin).
extraMetadata:
  dependencies: {}
  devDependencies: {}

npmRebuild: false
buildDependenciesFromSource: false

directories:
  output: release
  buildResources: resources

files:
  - dist-main/**/*
  - dist-renderer/**/*
  - resources/**/*
  - package.json

asar: true
asarUnpack: []

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Localhost Killer
  uninstallDisplayName: Localhost Killer
  menuCategory: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}
